# Read-only migration rehearsal. Never writes to Supabase or Neon.
# Feature-branch-only safe preview trigger; no deployment or database writes.
name: Footy isolated Neon sync preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/neon-participant-auth
    paths:
      - .github/workflows/footy-neon-sync-preview.yml

permissions:
  contents: read

concurrency:
  group: footy-isolated-neon-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: footy-neon-migration-preview
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Validate required read-only connections
        shell: bash
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_READONLY_URL}" || -z "${NEON_URL}" ]]; then
            echo "Migration secrets are missing. No databases were accessed."
            exit 1
          fi
          echo "Connection secrets present; running read-only comparison."
      - name: Show sanitized rehearsal configuration
        run: |
          echo "Migration workflow commit: ${GITHUB_SHA}"
          echo "Mode: read-only preview; Supabase session pooler now allowed"
      - name: Verify Python and read-only safety checks
        run: |
          python3 -m py_compile scripts/sync-footy-isolated-neon.py
          python3 scripts/test-sync-footy-safety.py
      - name: Diagnose read-only database access safely
        shell: bash
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=12
          export PGOPTIONS="-c default_transaction_read_only=on"
          tables=(tournaments teams stages tours grand_prix_seasons grand_prix_rounds profiles matches predictions grand_prix_manual_scores points_ledger match_scores prediction_scores analytics_stage_baseline analytics_stage_user analytics_stage_user_archetype analytics_stage_user_momentum import_rpl_matches)
          for entry in supabase neon; do
            if [[ "$entry" == supabase ]]; then
              export PGDATABASE="$SUPABASE_READONLY_URL"
              schema=public
            else
              export PGDATABASE="$NEON_URL"
              schema=migration_source
            fi
            errfile="$(mktemp)"
            if psql -w -X -q -v ON_ERROR_STOP=1 -t -A -c 'SELECT 1' >/dev/null 2>"$errfile"; then
              echo "$entry connection: OK"
            else
              # Never echo raw psql stderr: it may contain a URI or other secrets.
              if grep -qiE 'password authentication failed|invalid password|authentication failed' "$errfile"; then
                category="password authentication (check URL encoding, role password or pooler cache)"
              elif grep -qiE 'tenant or user not found|invalid tenant|user not found' "$errfile"; then
                category="pooler role / project tenant not recognized"
              elif grep -qiE 'could not translate host name|name or service not known|nodename nor servname' "$errfile"; then
                category="DNS resolution"
              elif grep -qiE 'timeout expired|timed out|no route to host|network is unreachable' "$errfile"; then
                category="network timeout or routing"
              elif grep -qiE 'SSL|certificate|TLS' "$errfile"; then
                category="TLS / certificate negotiation"
              elif grep -qiE 'invalid URI|invalid connection option|invalid port|missing.*password' "$errfile"; then
                category="malformed connection URL"
              elif grep -qiE 'no pg_hba.conf entry|permission denied|not allowed' "$errfile"; then
                category="access restriction"
              elif grep -qiE 'fe_sendauth: no password supplied' "$errfile"; then
                category="no usable password in connection URL"
              else
                category="unclassified PostgreSQL connection error"
              fi
              rm -f "$errfile"
              echo "::error::$entry connection: FAILED; category=$category"
              exit 1
            fi
            rm -f "$errfile"
            for table in "${tables[@]}"; do
              if ! psql -X -q -v ON_ERROR_STOP=1 -t -A -c "SELECT count(*) FROM \"$schema\".\"$table\"" >/dev/null 2>&1; then
                echo "::error::$entry table $schema.$table: FAILED (permissions or structure)"
                exit 1
              fi
            done
            echo "$entry access to all 18 tables: OK"
          done
      - name: Compare Supabase and isolated Neon (no writes)
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          python3 scripts/sync-footy-isolated-neon.py --mode preview
