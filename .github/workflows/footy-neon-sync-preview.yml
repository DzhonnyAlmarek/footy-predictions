# Read-only migration rehearsal. Never writes to Supabase or Neon.
# Feature-branch-only safe preview trigger; no deployment or database writes.
name: Footy isolated Neon sync preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/neon-participant-auth
    paths:
      - .github/workflows/footy-neon-sync-preview.yml

permissions:
  contents: read

concurrency:
  group: footy-isolated-neon-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: footy-neon-migration-preview
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Validate required read-only connections
        shell: bash
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_READONLY_URL}" || -z "${NEON_URL}" ]]; then
            echo "Migration secrets are missing. No databases were accessed."
            exit 1
          fi
          echo "Connection secrets present; running read-only comparison."
      - name: Show sanitized rehearsal configuration
        run: |
          echo "Migration workflow commit: ${GITHUB_SHA}"
          echo "Mode: read-only preview; Supabase session pooler now allowed"
      - name: Verify Python and read-only safety checks
        run: |
          python3 -m py_compile scripts/sync-footy-isolated-neon.py
          python3 scripts/test-sync-footy-safety.py
      - name: Validate secret URL structure without disclosure
        shell: bash
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          for var in ("SUPABASE_READONLY_URL", "NEON_URL"):
              raw = os.environ.get(var, "")
              print(f"{var}: present={bool(raw)}, trailing_whitespace={raw != raw.strip()}, contains_placeholder={'YOUR-PASSWORD' in raw or 'ТВОЙ_ПАРОЛЬ' in raw}")
              try:
                  u = urlsplit(raw)
                  print(f"{var}: scheme_valid={u.scheme in ('postgres', 'postgresql')}, host_present={bool(u.hostname)}, user_present={bool(u.username)}, password_present={bool(u.password)}, port_valid={u.port == 5432}, db_valid={u.path == '/postgres' if var.startswith('SUPABASE') else u.path == '/neondb'}, url_has_query={bool(u.query)}, user_is_expected={unquote(u.username or '') == ('footy_migration_reader.dfcfixmvplkhkaayfbbd' if 'pooler.supabase.com' in (u.hostname or '') else 'footy_migration_reader') if var.startswith('SUPABASE') else True}")
              except ValueError:
                  print(f"{var}: malformed URI structure")
          PY
      - name: Diagnose read-only database access safely
        shell: bash
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=12
          # Session pooler may reject PGOPTIONS as an unsupported startup parameter.
          unset PGOPTIONS || true
          tables=(tournaments teams stages tours grand_prix_seasons grand_prix_rounds profiles matches predictions grand_prix_manual_scores points_ledger match_scores prediction_scores analytics_stage_baseline analytics_stage_user analytics_stage_user_archetype analytics_stage_user_momentum import_rpl_matches)
          for entry in supabase neon; do
            if [[ "$entry" == supabase ]]; then
              db_url="$SUPABASE_READONLY_URL"
              schema=public
            else
              db_url="$NEON_URL"
              schema=migration_source
            fi
            errfile="$(mktemp)"
            if psql --dbname="$db_url" -w -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -t -A -c 'BEGIN READ ONLY; SELECT 1; ROLLBACK;' >/dev/null 2>"$errfile"; then
              echo "$entry connection: OK"
            else
              # Never echo raw psql stderr: it may contain a URI or other secrets.
              # A verbose psql error contains a 5-char SQLSTATE if PostgreSQL
              # supplied one. Emit only the validated code, never raw stderr.
              sqlstate="$(grep -Eo '(^|[[:space:]])[A-Z0-9]{5}:[[:space:]]' "$errfile" | head -1 | grep -Eo '[A-Z0-9]{5}' || true)"
              if [[ ! "$sqlstate" =~ ^[A-Z0-9]{5}$ ]]; then sqlstate="unavailable"; fi
              if grep -qiE 'tenant.*(user|not found)|tenant or user not found|ENOTFOUND|unknown tenant' "$errfile"; then
                category="pooler tenant or role mismatch"
              elif grep -qiE 'circuit breaker open' "$errfile"; then
                category="pooler circuit breaker"
              elif grep -qiE 'password authentication failed|invalid password|authentication failed' "$errfile"; then
                category="password authentication (check URL encoding, role password or pooler cache)"
              elif grep -qiE 'tenant or user not found|invalid tenant|user not found' "$errfile"; then
                category="pooler role / project tenant not recognized"
              elif grep -qiE 'could not translate host name|name or service not known|nodename nor servname' "$errfile"; then
                category="DNS resolution"
              elif grep -qiE 'timeout expired|timed out|no route to host|network is unreachable' "$errfile"; then
                category="network timeout or routing"
              elif grep -qiE 'SSL|certificate|TLS' "$errfile"; then
                category="TLS / certificate negotiation"
              elif grep -qiE 'invalid URI|invalid connection option|invalid port|missing.*password' "$errfile"; then
                category="malformed connection URL"
              elif grep -qiE 'role .* does not exist|role does not exist|user .* does not exist' "$errfile"; then
                category="PostgreSQL role not found"
              elif grep -qiE 'unsupported startup parameter|unsupported parameter|unsupported option|unrecognized configuration parameter' "$errfile"; then
                category="unsupported startup parameter"
              elif grep -qiE 'SASL|SCRAM|auth query|EAUTHQUERY|authentication backend' "$errfile"; then
                category="SCRAM or pooler authentication backend"
              elif grep -qiE 'database .* does not exist|unknown database' "$errfile"; then
                category="database name not found"
              elif grep -qiE 'too many connections|remaining connection slots|pool is full' "$errfile"; then
                category="connection limit"
              elif grep -qiE 'no pg_hba.conf entry|permission denied|not allowed' "$errfile"; then
                category="access restriction"
              elif grep -qiE 'fe_sendauth: no password supplied' "$errfile"; then
                category="no usable password in connection URL"
              elif grep -qiE 'could not connect to server|connection refused|server closed the connection|connection reset|EOF detected' "$errfile"; then
                category="server connection refused or dropped"
              elif grep -qiE 'FATAL|ERROR' "$errfile"; then
                category="PostgreSQL server rejected session (unrecognized server error)"
              elif grep -qiE 'psql:.*option|psql:.*usage|psql:.*invalid' "$errfile"; then
                category="psql connection invocation or URI error"
              else
                category="unclassified PostgreSQL connection error"
              fi
              # Only output a small, enumerated set of non-sensitive hints.
              if grep -qiE 'invalid authorization specification|P0[A-Z0-9]{3}|28000' "$errfile"; then
                echo "$entry hint: authorization specification rejected"
              elif grep -qiE '28P01' "$errfile"; then
                echo "$entry hint: password rejected"
              elif grep -qiE '08[A-Z0-9]{3}' "$errfile"; then
                echo "$entry hint: connection exception"
              elif grep -qiE 'unexpected response from server|server sent an error response during SSL exchange' "$errfile"; then
                echo "$entry hint: startup or TLS protocol problem"
              fi
              rm -f "$errfile"
              echo "::error::$entry connection: FAILED; category=$category; SQLSTATE=$sqlstate"
              exit 1
            fi
            rm -f "$errfile"
            for table in "${tables[@]}"; do
              if ! psql --dbname="$db_url" -w -X -q -v ON_ERROR_STOP=1 -t -A -c "SELECT count(*) FROM \"$schema\".\"$table\"" >/dev/null 2>&1; then
                echo "::error::$entry table $schema.$table: FAILED (permissions or structure)"
                exit 1
              fi
            done
            echo "$entry access to all 18 tables: OK"
          done
      - name: Compare Supabase and isolated Neon (no writes)
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          python3 scripts/sync-footy-isolated-neon.py --mode preview --print-checksum
