name: Footy isolated Neon sync (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run or apply to isolated Neon only"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply
          - candidate-audit
          - candidate-build
          - candidate-publish
      confirm:
        description: "For apply type APPLY-ISOLATED-NEON; for candidate-publish type PUBLISH-CANDIDATE"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'candidate-publish' && 'footy-candidate-registry-publish' || 'footy-test-neon-manual-sync' }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.ref == 'refs/heads/deploy/yandex-cloud' && (inputs.mode == 'dry-run' || inputs.mode == 'candidate-audit' || (inputs.mode == 'apply' && inputs.confirm == 'APPLY-ISOLATED-NEON'))
    runs-on: ubuntu-24.04
    environment: yandex-test
    timeout-minutes: 15
    env:
      FOOTY_SOURCE_SUPABASE_DATABASE_URL: ${{ secrets.FOOTY_SOURCE_SUPABASE_DATABASE_URL }}
      FOOTY_SOURCE_SUPABASE_CA_CERT: ${{ secrets.FOOTY_SOURCE_SUPABASE_CA_CERT }}
      FOOTY_TEST_NEON_DATABASE_URL: ${{ secrets.FOOTY_TEST_NEON_DATABASE_URL }}
      FOOTY_SYNC_MODE: ${{ inputs.mode }}
      FOOTY_SYNC_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install locked dependencies and PostgreSQL client
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts pg@8
      - name: Compare and optionally apply isolated sync
        if: inputs.mode != 'candidate-audit'
        run: node scripts/footy-neon-sync-manual.mjs
      - name: Checkout candidate audit code
        if: inputs.mode == 'candidate-audit'
        uses: actions/checkout@v4
        with:
          ref: feature/yandex-neon-production-prep-20261019
          path: candidate-audit
          persist-credentials: false
      - name: Candidate data drift audit (read-only)
        if: inputs.mode == 'candidate-audit'
        env:
          FOOTY_CANDIDATE_NEON_DATABASE_URL: ${{ secrets.FOOTY_CANDIDATE_NEON_DATABASE_URL }}
        run: |
          test -n "$FOOTY_CANDIDATE_NEON_DATABASE_URL" || { echo "Missing candidate Neon secret"; exit 1; }
          cp candidate-audit/scripts/footy-cutover-candidate-audit.mjs scripts/footy-cutover-candidate-audit.mjs
          node scripts/footy-cutover-candidate-audit.mjs

  build-candidate:
    if: github.ref == 'refs/heads/deploy/yandex-cloud' && inputs.mode == 'candidate-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout isolated candidate source
        uses: actions/checkout@v4
        with:
          ref: feature/yandex-neon-production-prep-20261019
          persist-credentials: false
      - name: Build candidate image only (no registry push or deploy)
        run: bash scripts/build-cutover-candidate.sh

  publish-candidate:
    if: github.ref == 'refs/heads/deploy/yandex-cloud' && inputs.mode == 'candidate-publish' && inputs.confirm == 'PUBLISH-CANDIDATE'
    runs-on: ubuntu-24.04
    environment: yandex-test
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          ref: feature/yandex-neon-production-prep-20261019
          persist-credentials: false
      - name: Build isolated candidate image
        run: bash scripts/build-cutover-candidate.sh
      - name: Obtain short-lived Yandex IAM token using GitHub OIDC
        id: yandex-auth
        env:
          FEDERATION_ID: ajeig95704l4f4nmeeak
          YC_AUDIENCE: https://github.com/DzhonnyAlmarek
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${YC_AUDIENCE}" | jq -er '.value')"
          response="$(jq -nc --arg token "$oidc" --arg federation "$FEDERATION_ID" \
            '{identityToken:$token,federationId:$federation}' | \
            curl --fail-with-body --silent --show-error -X POST \
              -H 'Content-Type: application/json' --data-binary @- \
              https://iam.api.cloud.yandex.net/iam/v1/tokens)"
          iam="$(jq -er '.iamToken' <<<"$response")"
          echo "::add-mask::$iam"
          echo "$iam" | docker login --username iam --password-stdin cr.yandex
      - name: Publish candidate image only
        env:
          REGISTRY_ID: crpocq57tud830bhe7ck
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          target="cr.yandex/$REGISTRY_ID/footy-cutover-candidate:$commit"
          docker tag "footy-cutover-candidate:$commit" "$target"
          docker push "$target"
          echo "Published image: $target"
          echo "No container deployed; no DNS or database changes."
