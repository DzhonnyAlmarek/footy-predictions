name: Diagnose Footy Yandex access (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/feature/cutover-admin-readiness-20261020' }}
    runs-on: ubuntu-latest
    environment: yandex-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request Yandex IAM token
        id: auth
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/DzhonnyAlmarek');
            core.setSecret(token);
            core.setOutput('jwt', token);
      - name: Check Yandex Cloud resource visibility
        env:
          GITHUB_OIDC_JWT: ${{ steps.auth.outputs.jwt }}
        run: |
          set -euo pipefail
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o /tmp/yc-install.sh
          bash /tmp/yc-install.sh -i "$HOME/yc" -n
          http_code="$(curl -sS -o /tmp/token.json -w '%{http_code}' -X POST https://auth.yandex.cloud/oauth/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode 'audience=ajefphrico3hogta85jt' \
            --data-urlencode "subject_token=$GITHUB_OIDC_JWT" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          test "$http_code" = 200
          token="$(jq -er '.access_token' /tmp/token.json)"
          echo "::add-mask::$token"
          export YC_IAM_TOKEN="$token"
          rm -f /tmp/token.json
          YC="$HOME/yc/bin/yc"
          "$YC" config profile create default
          "$YC" config set endpoint api.cloud.yandex.net:443
          "$YC" config set cloud-id b1ge8jgq7kh768aapao1
          "$YC" config set folder-id b1gtdrn5t149v0ckl6ql
          failures=0
          for label in container runtime-account secret registry; do
            echo "::group::$label"
            if (
              set -e
              case "$label" in
              container) "$YC" serverless container get --id bbaquq5i6l35i5kbiufb >/dev/null ;;
              runtime-account) "$YC" iam service-account get --id ajekinma5dcn8agcht7a >/dev/null ;;
              secret) "$YC" lockbox secret get --id e6qht354a446srlm5ge9 >/dev/null ;;
              registry) "$YC" container registry get --id crpocq57tud830bhe7ck >/dev/null ;;
            esac
            ); then
              echo "RESULT: PASS"
            else
              echo "RESULT: FAIL"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          # IAM binding visibility may be restricted independently of resource read access.
          # A missing direct binding is NOT proof that a role is absent: it may be inherited.
          echo "::group::IAM role bindings (read only)"
          check_bindings() {
            label="$1"; shift
            if "$YC" "$@" --format json > /tmp/footy-bindings.json 2> /tmp/footy-bindings.err; then
              echo "$label: READ_OK"
              jq -r '
                .. | objects
                | select(has("role_id") or has("roleId"))
                | [(.role_id // .roleId), (.subject.id // .subject_id // .subjectId // "unknown")]
                | @tsv
              ' /tmp/footy-bindings.json | grep -E '^(serverless-containers\.editor|iam\.serviceAccounts\.user|container-registry\.images\.puller|lockbox\.payloadViewer|lockbox\.viewer|kms\.keys\.encrypterDecrypter)[[:space:]]' || true
            else
              echo "$label: BINDINGS_UNREADABLE (not evidence of missing roles)"
              grep -E 'PermissionDenied|Unauthenticated|request.id|ERROR' /tmp/footy-bindings.err | tail -n 3 || true
            fi
          }
          check_bindings "folder" resource-manager folder list-access-bindings --id b1gtdrn5t149v0ckl6ql
          check_bindings "runtime-account" iam service-account list-access-bindings --id ajekinma5dcn8agcht7a
          check_bindings "registry" container registry list-access-bindings --id crpocq57tud830bhe7ck
          check_bindings "lockbox-secret" lockbox secret list-access-bindings --id e6qht354a446srlm5ge9
          rm -f /tmp/footy-bindings.json /tmp/footy-bindings.err
          echo "::endgroup::"
          echo "::group::Lockbox metadata: custom KMS key"
          if "$YC" lockbox secret get --id e6qht354a446srlm5ge9 --format json > /tmp/footy-secret-metadata.json; then
            jq -r '(.kms_key_id // .kmsKeyId // .encryption_key_id // "not-exposed-in-secret-metadata") | "KMS key ID: \(.)"' /tmp/footy-secret-metadata.json
          else
            echo "Secret metadata unavailable"
          fi
          rm -f /tmp/footy-secret-metadata.json
          echo "::endgroup::"
          echo "::group::Published candidate image (read only)"
          if "$YC" container image list --registry-id crpocq57tud830bhe7ck --format json > /tmp/footy-image-metadata.json 2> /tmp/footy-image.err; then
            echo "Candidate image metadata: READ_OK"
            jq -r '.[] | select((.tags // []) | index("244adfa8eb4158f73ff14f0449585d2656af1ecf")) | [.id, (.digest // "unknown")] | @tsv' /tmp/footy-image-metadata.json
          else
            echo "Candidate image metadata: UNAVAILABLE"
            tail -n 4 /tmp/footy-image.err
          fi
          rm -f /tmp/footy-image-metadata.json /tmp/footy-image.err
          echo "::endgroup::"
          echo "::group::Referenced Lockbox version metadata (read only)"
          if "$YC" lockbox secret list-versions --id e6qht354a446srlm5ge9 --format json > /tmp/footy-versions.json 2> /tmp/footy-versions.err; then
            jq -r '.. | objects | select(.id? == "e6qgv896cvs5t8n3jbpo") | [.id, (.status // "unknown")] | @tsv' /tmp/footy-versions.json
          else
            echo "Secret version metadata: UNAVAILABLE"
            tail -n 4 /tmp/footy-versions.err
          fi
          rm -f /tmp/footy-versions.json /tmp/footy-versions.err
          echo "::endgroup::"
          echo "Failed checks: $failures"
          test "$failures" -eq 0
