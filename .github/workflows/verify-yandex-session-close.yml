name: Verify Yandex session close behavior
on:
  push:
    branches:
      - fix/yandex-tab-session-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build cutover candidate without live credentials
        run: docker build --platform linux/amd64 -f Dockerfile.cutover-production-candidate -t footy-yandex-session-check:local .
      - name: Confirm image platform
        run: test "$(docker image inspect footy-yandex-session-check:local --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
