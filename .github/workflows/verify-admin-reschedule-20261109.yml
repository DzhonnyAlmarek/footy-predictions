name: Verify admin reschedule query fix (build only)
on:
  push:
    branches: [fix/admin-reschedule-query-20261109]
    paths: [.github/workflows/verify-admin-reschedule-20261109.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Verify reschedule SQL guards remain present
        run: |
          set -euo pipefail
          grep -Fq "body?.action === \"reschedule_match\"" app/api/cutover/admin/route.ts
          grep -Fq "m.deadline_at > now() AND m.kickoff_at > now()" app/api/cutover/admin/route.ts
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('app/api/cutover/admin/route.ts', 'utf8');
          const start = source.indexOf('if (body?.action === "reschedule_match")');
          const end = source.indexOf('if (body?.action === "rename_stage")', start);
          if (start < 0 || end < 0) throw new Error('Cannot locate reschedule handler');
          const handler = source.slice(start, end);
          if (handler.includes('existing.stage_id=s.id') || handler.includes('s.matches_required')) {
            throw new Error('Invalid reschedule stage alias or capacity check remains');
          }
          for (const guard of ["m.status='scheduled'", 'm.deadline_at > now()', 'm.kickoff_at > now()', 'footy_cutover.predictions', 'footy_cutover.points_ledger']) {
            if (!handler.includes(guard)) throw new Error('Missing reschedule guard: ' + guard);
          }
          console.log('Reschedule query static guard checks passed');
          NODE
      - name: Next.js build without production credentials
        run: npm run build
        env:
          DEPLOY_TARGET: yandex-neon-production-candidate
          ENABLE_CUTOVER_PRODUCTION_CANDIDATE: "false"
          NEXT_PUBLIC_SUPABASE_URL: https://isolated.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-only-placeholder-not-a-real-key
