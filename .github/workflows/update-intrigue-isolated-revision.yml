name: Update isolated intrigue to stage-filtered image via REST

on:
  push:
    branches:
      - feature/admin-result-guard-20261102
    paths:
      - .github/workflows/update-intrigue-isolated-revision.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: footy-admin-isolated-revision
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/feature/admin-result-guard-20261102' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: yandex-test
    timeout-minutes: 15
    env:
      CONTAINER_ID: bba2sadajpqn5knluf42
      SERVICE_ACCOUNT_ID: ajefphrico3hogta85jt
      REGISTRY_PREFIX: registry.yandexcloud.net/crpocq57tud830bhe7ck/footy-cutover-candidate
      API_URL: https://serverless-containers.api.cloud.yandex.net/containers/v1
      EXPECTED_HOST: ep-curly-wildflower-b1bo8av4.c-5.eu-central-1.aws.neon.tech
      ISOLATED_SECRET_ID: e6q9useq2jbpu1lqo1qd
      RUNTIME_ACCOUNT_ID: ajekinma5dcn8agcht7a
    steps:
      - name: Validate explicitly authorized pinned release and target
        env:
          IMAGE_SHA: 3f773342b717bff1e19c75c9f30623dd12cdfda6
          GITHUB_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Full Git SHA required"; exit 1; }
          test "$CONTAINER_ID" = bba2sadajpqn5knluf42
          test "$CONTAINER_ID" != bbaquq5i6l35i5kbiufb
          echo "Pinned isolated container: $CONTAINER_ID; image commit: $IMAGE_SHA"
      - name: Obtain Yandex IAM token via existing GitHub OIDC federation
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const jwt = await core.getIDToken('https://github.com/DzhonnyAlmarek');
            core.setSecret(jwt);
            core.setOutput('jwt', jwt);
      - name: Inspect active revision and prepare safe request
        env:
          GITHUB_OIDC_JWT: ${{ steps.oidc.outputs.jwt }}
          IMAGE_SHA: 3f773342b717bff1e19c75c9f30623dd12cdfda6
          GITHUB_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/footy-iam.json /tmp/footy-current.json /tmp/footy-revisions.json /tmp/footy-deploy.json /tmp/footy-operation.json' EXIT
          code="$(curl -sS -o /tmp/footy-iam.json -w '%{http_code}' --max-time 30 \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          [[ "$code" = 200 ]] || { echo "OIDC token exchange failed: HTTP $code"; exit 1; }
          IAM_TOKEN="$(jq -er '.access_token' /tmp/footy-iam.json)"
          echo "::add-mask::$IAM_TOKEN"
          # Authenticate only against the explicitly pinned container.
          code="$(curl -sS -o /tmp/footy-revisions.json -w '%{http_code}' \
            -H "Authorization: Bearer $IAM_TOKEN" "$API_URL/revisions?containerId=$CONTAINER_ID&pageSize=100")"
          [[ "$code" = 200 ]] || { echo "Unable to read container revisions: HTTP $code"; exit 1; }
          ACTIVE_ID="$(jq -er '[.revisions[] | select(.status=="ACTIVE" and .containerId==env.CONTAINER_ID)] | if length==1 then .[0].id else empty end' /tmp/footy-revisions.json)"
          [[ "$ACTIVE_ID" =~ ^bba[a-z0-9]+$ ]] || { echo "No unique ACTIVE revision"; exit 1; }
          code="$(curl -sS -o /tmp/footy-current.json -w '%{http_code}' \
            -H "Authorization: Bearer $IAM_TOKEN" "$API_URL/revisions/$ACTIVE_ID")"
          [[ "$code" = 200 ]] || { echo "Unable to read active revision: HTTP $code"; exit 1; }
          # Pin the previous verified isolated image: never update an unexpected revision.
          jq -e --arg expected "$REGISTRY_PREFIX:6b2ef4d3300d423e94b14809ef51f1960af50325"              '.image.imageUrl==$expected' /tmp/footy-current.json >/dev/null || { echo "Unexpected prior test image; abort"; exit 1; }
          # Never print revision JSON: it can contain credentials.
          jq -e --arg id "$CONTAINER_ID" --arg host "$EXPECTED_HOST" --arg secret "$ISOLATED_SECRET_ID" --arg runtime "$RUNTIME_ACCOUNT_ID" '
            .containerId==$id and .status=="ACTIVE" and .serviceAccountId==$runtime
            and .image.environment.DEPLOY_TARGET=="yandex-neon-admin-isolated"
            and .image.environment.CUTOVER_AUTH_ALLOWED_HOST==$host
            and (.image.environment.ENABLE_CUTOVER_PREDICTION_WRITES // "false")=="false"
            and (.image.environment.ENABLE_CUTOVER_ADMIN_WRITES // "false")=="false"
            and (.image.environment.ENABLE_CUTOVER_RESULT_WRITES // "false")=="false"
            and ((.secrets // []) | length)==2
            and ((.secrets // []) | all(.id==$secret and .versionId=="e6qps2c87aqiq5vjdm3g"))
            and ((.secrets // []) | map(.key) | sort)==(["CUTOVER_AUTH_DATABASE_URL","CUTOVER_RATE_PEPPER"]|sort)
            and .resources.memory != null and .resources.cores != null
          ' /tmp/footy-current.json >/dev/null || { echo "Isolated revision safety validation failed; no deployment"; exit 1; }
          # Preserve all known revision configuration. Fail closed on advanced settings
          # until reviewed, rather than silently dropping network/mount/async/other options.
          jq -e '
            ((.connectivity // {}) == {}) and
            ((.storageMounts // []) == []) and ((.mounts // []) == []) and
            ((.asyncInvocationConfig // {}) == {}) and
            ((.metadataOptions // {}) == {})
          ' /tmp/footy-current.json >/dev/null || { echo "Advanced config requires manual review"; exit 1; }
          jq --arg url "$REGISTRY_PREFIX:$IMAGE_SHA" --arg id "$CONTAINER_ID" --arg host "$EXPECTED_HOST" '{
            containerId:$id,
            imageSpec: (.image | {
              imageUrl:$url,
              environment:((.environment // {}) + {DEPLOY_TARGET:"yandex-neon-admin-isolated", CUTOVER_AUTH_ALLOWED_HOST:$host, CUTOVER_SHOW_TEST_MATCHES:"false", ENABLE_CUTOVER_AUTH:"true", ENABLE_CUTOVER_LOGIN:"true", ENABLE_CUTOVER_PREDICTION_WRITES:"false", ENABLE_CUTOVER_ADMIN_WRITES:"false", ENABLE_CUTOVER_RESULT_WRITES:"false"})
            } + (if .command then {command:.command} else {} end)
              + (if .args then {args:.args} else {} end)
              + (if .workingDir then {workingDir:.workingDir} else {} end)),
            resources:.resources,
            executionTimeout:.executionTimeout,
            concurrency:.concurrency,
            serviceAccountId:.serviceAccountId,
            secrets:(.secrets // []),
            connectivity:(.connectivity // {}),
            provisionPolicy:(.provisionPolicy // {}),
            logOptions:(.logOptions // {}),
            scalingPolicy:(.scalingPolicy // {})
          }' /tmp/footy-current.json > /tmp/footy-deploy.json
          echo "Active revision: $ACTIVE_ID"
          echo "Lockbox bindings preserved: $(jq '.secrets | length' /tmp/footy-deploy.json)"
          echo "Target image: $REGISTRY_PREFIX:$IMAGE_SHA"
          if [[ "$GITHUB_HEAD_COMMIT_MESSAGE" != "isolated-intrigue-stage-filter-deploy-once-20261108" ]]; then
            echo "ISOLATED PREFLIGHT OK. No revision deployed."
            exit 0
          fi
          code="$(curl -sS -o /tmp/footy-operation.json -w '%{http_code}' \
            -X POST "$API_URL/revisions:deploy" \
            -H "Authorization: Bearer $IAM_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/footy-deploy.json)"
          [[ "$code" = 200 ]] || { echo "Deploy request failed (HTTP $code); response intentionally hidden"; exit 1; }
          jq -e '.id and (.error == null)' /tmp/footy-operation.json >/dev/null || { echo "Yandex operation not accepted"; exit 1; }
          echo "Yandex deployment operation ID: $(jq -r '.id' /tmp/footy-operation.json)"
          echo "Deployment requested; waiting for image to become ACTIVE."
          confirmed=0
          for attempt in $(seq 1 24); do
            sleep 5
            code="$(curl -sS --max-time 30 -o /tmp/footy-revisions.json -w '%{http_code}' \
              -H "Authorization: Bearer $IAM_TOKEN" "$API_URL/revisions?containerId=$CONTAINER_ID&pageSize=100")"
            [[ "$code" = 200 ]] || { echo "Cannot confirm revision: HTTP $code"; exit 1; }
            NEW_ID="$(jq -r --arg image "$REGISTRY_PREFIX:$IMAGE_SHA" \
              '[.revisions[] | select(.status=="ACTIVE" and .image.imageUrl==$image)] | if length==1 then .[0].id else empty end' \
              /tmp/footy-revisions.json)"
            if [[ "$NEW_ID" =~ ^bba[a-z0-9]+$ ]]; then
              echo "Confirmed new ACTIVE revision: $NEW_ID"
              confirmed=1
              break
            fi
          done
          [[ "$confirmed" = 1 ]] || { echo "Deployment accepted but target ACTIVE revision not yet confirmed"; exit 1; }
