name: Verify current-stage prediction guards
on:
  push:
    branches:
      - fix/current-stage-prediction-guard-20261109
    paths:
      - .github/workflows/verify-current-stage-guard-20261109.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build without production secrets
        run: npm run build
        env:
          DEPLOY_TARGET: yandex-neon-production-candidate
          ENABLE_CUTOVER_PRODUCTION_CANDIDATE: "false"
          NEXT_PUBLIC_SUPABASE_URL: https://isolated.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-only-placeholder-not-a-real-key
