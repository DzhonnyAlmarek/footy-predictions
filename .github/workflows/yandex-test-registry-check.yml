name: Yandex test registry check (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: yandex-test
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/DzhonnyAlmarek');
            core.setSecret(token);
            core.setOutput('jwt', token);
      - name: Authenticate to Yandex Container Registry
        shell: bash
        env:
          GITHUB_OIDC_JWT: ${{ steps.oidc.outputs.jwt }}
          SERVICE_ACCOUNT_ID: ajefphrico3hogta85jt
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --request POST 'https://auth.yandex.cloud/oauth/token' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(jq -er '.access_token' <<< "$response")"
          echo "::add-mask::${iam_token}"
          printf '%s' "$iam_token" | docker login registry.yandexcloud.net --username iam --password-stdin
          unset iam_token response GITHUB_OIDC_JWT
      - name: Check known image tag without pulling or pushing
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='registry.yandexcloud.net/crpocq57tud830bhe7ck/footy-predictions-test:7f33956327942e99f7673fac097e423edd54b48b'
          echo "Checking: $IMAGE"
          if docker buildx imagetools inspect "$IMAGE" > /tmp/image-inspect.txt 2>/tmp/image-error.txt; then
            echo 'IMAGE_PRESENT: yes'
            grep -m1 '^Digest:' /tmp/image-inspect.txt || true
          else
            echo 'IMAGE_PRESENT: not confirmed'
            echo 'Registry request failed. Could be missing image, unavailable registry, or insufficient permissions.'
            sed -E 's#(https?://)[^ /]+#\\1[redacted]#g' /tmp/image-error.txt | head -15
            exit 1
          fi
      - name: Logout
        if: always()
        run: docker logout registry.yandexcloud.net || true
