name: Verify legacy auth redirect diagnostics
on:
  push:
    branches:
      - fix/legacy-auth-redirect-diagnostics-20261108
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://isolated.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-placeholder
          SUPABASE_SERVICE_ROLE_KEY: test-not-real-secret-value-long-enough-for-build
