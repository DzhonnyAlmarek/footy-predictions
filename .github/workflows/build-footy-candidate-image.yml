name: Build and push isolated Footy image (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BUILD-ISOLATED-IMAGE to authorize Docker push (no deployment)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    if: ${{ github.ref == 'refs/heads/feature/cutover-admin-readiness-20261020' && inputs.confirmation == 'BUILD-ISOLATED-IMAGE' }}
    runs-on: ubuntu-latest
    environment: yandex-test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated build inputs
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f package-lock.json
          grep -q 'NEXT_PUBLIC_SUPABASE_URL=https://isolated.invalid' Dockerfile
          grep -q 'DEPLOY_TARGET=yandex-neon-test' Dockerfile
          test -f .dockerignore
      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/DzhonnyAlmarek');
            core.setSecret(token);
            core.setOutput('jwt', token);
      - name: Exchange OIDC for Yandex IAM token
        env:
          GITHUB_OIDC_JWT: ${{ steps.oidc.outputs.jwt }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 -o /tmp/yc-token.json -w '%{http_code}' \
            -X POST https://auth.yandex.cloud/oauth/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode 'audience=ajefphrico3hogta85jt' \
            --data-urlencode "subject_token=${GITHUB_OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          test "$code" = 200
          token="$(jq -er '.access_token' /tmp/yc-token.json)"
          echo "::add-mask::$token"
          echo "YC_IAM_TOKEN=$token" >> "$GITHUB_ENV"
          rm -f /tmp/yc-token.json
      - name: Build isolated Docker image
        env:
          IMAGE: cr.yandex/crpocq57tud830bhe7ck/footy-cutover-candidate
        run: |
          set -euo pipefail
          docker build --pull --tag "$IMAGE:${GITHUB_SHA}" .
      - name: Push image to test registry
        env:
          IMAGE: cr.yandex/crpocq57tud830bhe7ck/footy-cutover-candidate
        run: |
          set -euo pipefail
          printf '%s' "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker push "$IMAGE:${GITHUB_SHA}"
          docker logout cr.yandex
      - name: Confirm image exists in registry
        run: |
          set -euo pipefail
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o /tmp/yc-install.sh
          bash /tmp/yc-install.sh -i "$HOME/yc" -n
          YC="$HOME/yc/bin/yc"
          "$YC" config profile create default
          "$YC" config set cloud-id b1ge8jgq7kh768aapao1
          "$YC" config set folder-id b1gtdrn5t149v0ckl6ql
          "$YC" container image list --registry-id crpocq57tud830bhe7ck --format json > /tmp/images.json
          jq -e --arg tag "$GITHUB_SHA" 'any(.[]; ((.name // "") | endswith(":" + $tag)) or any((.tags // [])[]; . == $tag or endswith(":" + $tag)))' /tmp/images.json
          echo "Image uploaded: cr.yandex/crpocq57tud830bhe7ck/footy-cutover-candidate:${GITHUB_SHA}"
