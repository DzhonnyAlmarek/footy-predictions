name: Yandex test build (isolated)
on:
  push:
    branches:
      - deploy/yandex-cloud
    paths:
      - "app/**"
      - "lib/**"
      - "middleware.ts"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/yandex-test-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DEPLOY_TARGET: "yandex-neon-test"
      NEXT_PUBLIC_SUPABASE_URL: "https://isolated.invalid"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-only-placeholder-not-a-real-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify production image isolation
        run: |
          grep -q 'ENV DEPLOY_TARGET=yandex-neon-test' Dockerfile
          ! grep -q '^ARG NEXT_PUBLIC_SUPABASE_' Dockerfile
      - name: Build isolated Docker image (no push)
        run: docker build --pull -t footy-test-ci:local .
      - name: Smoke test Docker startup and API isolation
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name footy-test-ci -p 127.0.0.1:18080:8080 footy-test-ci:local
          trap 'docker logs footy-test-ci || true; docker rm -f footy-test-ci || true' EXIT
          healthy=0
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/test/health -o /tmp/health.json 2>/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != 1 ]]; then
            echo "Isolated test container failed health check"
            exit 1
          fi
          grep -q '"environment":"isolated-test"' /tmp/health.json
          status=$(curl --silent --output /tmp/blocked.json --write-out '%{http_code}' http://127.0.0.1:18080/api/login)
          if [[ "$status" != "503" ]]; then
            echo "Production login API was not blocked: HTTP $status"
            exit 1
          fi
          grep -q 'isolated_test_api_disabled' /tmp/blocked.json
