name: Verify Yandex status-card fix (build only)
on:
  push:
    branches:
      - fix/yandex-status-refresh-20261109
    paths:
      - ".github/workflows/verify-yandex-status-card-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build candidate without production credentials
        run: npm run build
        env:
          DEPLOY_TARGET: yandex-neon-production-candidate
          ENABLE_CUTOVER_PRODUCTION_CANDIDATE: "false"
          NEXT_PUBLIC_SUPABASE_URL: https://isolated.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-only-placeholder-not-a-real-key
      - name: Build standalone Docker container
        run: docker build -f Dockerfile.cutover-production-candidate -t footy-status-card-fix:verify .
