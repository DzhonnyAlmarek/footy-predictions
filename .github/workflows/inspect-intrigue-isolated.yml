name: Inspect isolated intrigue container state (read only)

on:
  push:
    branches:
      - feature/admin-result-guard-20261102
    paths:
      - .github/workflows/inspect-intrigue-isolated.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: footy-admin-isolated-revision
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/feature/admin-result-guard-20261102' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: yandex-test
    timeout-minutes: 15
    env:
      CONTAINER_ID: bba2sadajpqn5knluf42
      SERVICE_ACCOUNT_ID: ajefphrico3hogta85jt
      REGISTRY_PREFIX: registry.yandexcloud.net/crpocq57tud830bhe7ck/footy-cutover-candidate
      API_URL: https://serverless-containers.api.cloud.yandex.net/containers/v1
      EXPECTED_HOST: ep-curly-wildflower-b1bo8av4.c-5.eu-central-1.aws.neon.tech
      ISOLATED_SECRET_ID: e6q9useq2jbpu1lqo1qd
      RUNTIME_ACCOUNT_ID: ajekinma5dcn8agcht7a
    steps:
      - name: Validate explicitly authorized pinned release and target
        env:
          IMAGE_SHA: 415b13fff368812e8a7995aabf91a343f09f180a
          GITHUB_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Full Git SHA required"; exit 1; }
          test "$CONTAINER_ID" = bba2sadajpqn5knluf42
          test "$CONTAINER_ID" != bbaquq5i6l35i5kbiufb
          echo "Pinned isolated container: $CONTAINER_ID; image commit: $IMAGE_SHA"
      - name: Obtain Yandex IAM token via existing GitHub OIDC federation
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const jwt = await core.getIDToken('https://github.com/DzhonnyAlmarek');
            core.setSecret(jwt);
            core.setOutput('jwt', jwt);
      - name: Inspect active revision and prepare safe request
        env:
          GITHUB_OIDC_JWT: ${{ steps.oidc.outputs.jwt }}
          IMAGE_SHA: 415b13fff368812e8a7995aabf91a343f09f180a
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/footy-iam.json /tmp/footy-current.json /tmp/footy-revisions.json /tmp/footy-deploy.json /tmp/footy-operation.json /tmp/footy-container.json /tmp/footy-lockbox-meta.json /tmp/footy-binding.json' EXIT
          code="$(curl -sS -o /tmp/footy-iam.json -w '%{http_code}' --max-time 30 \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          [[ "$code" = 200 ]] || { echo "OIDC token exchange failed: HTTP $code"; exit 1; }
          IAM_TOKEN="$(jq -er '.access_token' /tmp/footy-iam.json)"
          echo "::add-mask::$IAM_TOKEN"
          # Authenticate only against the explicitly pinned container.
          code="$(curl -sS -o /tmp/footy-revisions.json -w '%{http_code}' \
            -H "Authorization: Bearer $IAM_TOKEN" "$API_URL/revisions?containerId=$CONTAINER_ID&pageSize=100")"
          [[ "$code" = 200 ]] || { echo "Unable to read container revisions: HTTP $code"; exit 1; }
          echo "Revisions JSON type: $(jq -r 'type' /tmp/footy-revisions.json)"
          echo "Revision response keys: $(jq -r 'if type=="object" then keys|join(",") else "not_object" end' /tmp/footy-revisions.json)"
          echo "Revision count: $(jq -r 'if type=="array" then length else (.revisions // [])|length end' /tmp/footy-revisions.json)"
          echo "Revision statuses: $(jq -r 'if type=="array" then [.[].status]|unique|join(",") else [.revisions[]?|.status]|unique|join(",") end' /tmp/footy-revisions.json)"
          code="$(curl -sS -o /tmp/footy-container.json -w '%{http_code}' \
            -H "Authorization: Bearer $IAM_TOKEN" "$API_URL/containers/$CONTAINER_ID")"
          echo "Isolated container GET status: $code"
          if [[ "$code" = 200 ]]; then
            jq -r '{id,name,folderId,description,createdAt,revisionCount:(.revisionCount // null)}' /tmp/footy-container.json
          fi
          code="$(curl -sS -o /tmp/footy-lockbox-meta.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $IAM_TOKEN" \
            "https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$ISOLATED_SECRET_ID")"
          echo "Isolated Lockbox metadata status: $code"
          if [[ "$code" = 200 ]]; then
            jq -r '{id,name,status,currentVersionId:(.currentVersion.id // null),currentVersionStatus:(.currentVersion.status // null),keys:(.currentVersion.payloadEntryKeys // [])}' /tmp/footy-lockbox-meta.json
          fi
          test "$(jq -r '.currentVersion.id' /tmp/footy-lockbox-meta.json)" = "e6qps2c87aqig5yidm3g" || { echo "Unexpected new version ID"; exit 1; }
          jq -e '(.currentVersion.payloadEntryKeys | sort)==(["CUTOVER_AUTH_DATABASE_URL","CUTOVER_RATE_PEPPER"]|sort)' /tmp/footy-lockbox-meta.json >/dev/null || { echo "Expected two keys absent"; exit 1; }
          code="$(curl -sS -o /tmp/footy-binding.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $IAM_TOKEN" \
            "https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$ISOLATED_SECRET_ID:listAccessBindings")"
          echo "Secret-specific IAM binding status: $code"
          if [[ "$code" = 200 ]]; then
            jq -r --arg id "$RUNTIME_ACCOUNT_ID" '{bindingCount:(.accessBindings // []|length),runtimeRoles:[.accessBindings[]?|select(.subject.id==$id)|.roleId]}' /tmp/footy-binding.json
          fi
          echo "Lockbox version verified; read-only."

