name: Footy Neon full backup to Yandex Object Storage (manual validation)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: footy-neon-full-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: yandex-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install AWS CLI v2
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install
          aws --version
      - name: Full Neon dump and upload outside Neon
        env:
          FOOTY_BACKUP_NEON_DATABASE_URL: ${{ secrets.FOOTY_BACKUP_NEON_DATABASE_URL }}
          FOOTY_BACKUP_S3_BUCKET: ${{ secrets.FOOTY_BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FOOTY_BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FOOTY_BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: bash scripts/backup-footy-neon-full.sh
