name: Footy Neon daily encrypted backup to Yandex Object Storage
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: footy-neon-full-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: yandex-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Pin the successfully tested script commit; do not track mutable feature code.
          ref: 3172b0134c6a4280a7e6835857875e6c14173154
      - name: Install age encryption tool
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          age --version
          aws --version
          docker --version
      - name: Full encrypted Neon dump and upload outside Neon
        env:
          FOOTY_BACKUP_NEON_DATABASE_URL: ${{ secrets.FOOTY_BACKUP_NEON_DATABASE_URL }}
          FOOTY_BACKUP_S3_BUCKET: ${{ secrets.FOOTY_BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FOOTY_BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FOOTY_BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          FOOTY_BACKUP_AGE_RECIPIENT: ${{ vars.FOOTY_BACKUP_AGE_RECIPIENT }}
        run: bash scripts/backup-footy-neon-encrypted.sh

      - name: Register backup failure as GitHub issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BACKUP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[BACKUP FAILURE] Encrypted Neon daily backup"
          existing="$(gh issue list --state open --limit 100 --json title,number --jq '.[] | select(.title == "[BACKUP FAILURE] Encrypted Neon daily backup") | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "Backup failed: $BACKUP_RUN_URL"
          else
            gh issue create --title "$title" --body "Encrypted Neon backup failed. Inspect workflow logs: $BACKUP_RUN_URL. Do not delete existing backup objects."
          fi
