name: Footy Neon full backup to Yandex Object Storage
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: footy-neon-full-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: yandex-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The verified backup script is maintained in the isolated candidate branch.
          ref: feature/cutover-admin-readiness-20261020
      - name: Install PostgreSQL client and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli
      - name: Full Neon dump and upload outside Neon
        env:
          FOOTY_BACKUP_NEON_DATABASE_URL: ${{ secrets.FOOTY_BACKUP_NEON_DATABASE_URL }}
          FOOTY_BACKUP_S3_BUCKET: ${{ secrets.FOOTY_BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FOOTY_BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FOOTY_BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: bash scripts/backup-footy-neon-full.sh
