name: Footy Supabase to Neon diff (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.ref == 'refs/heads/deploy/yandex-cloud'
    runs-on: ubuntu-24.04
    environment: yandex-test
    timeout-minutes: 15
    env:
      FOOTY_SOURCE_SUPABASE_DATABASE_URL: ${{ secrets.FOOTY_SOURCE_SUPABASE_DATABASE_URL }}
      FOOTY_SOURCE_SUPABASE_CA_CERT: ${{ secrets.FOOTY_SOURCE_SUPABASE_CA_CERT }}
      FOOTY_TEST_NEON_DATABASE_URL: ${{ secrets.FOOTY_TEST_NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install project dependencies and PostgreSQL client
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts pg@8
      - name: Compare source and Neon read-only
        run: node scripts/footy-neon-diff-readonly.mjs
