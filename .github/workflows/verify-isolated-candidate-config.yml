name: Verify isolated candidate deployment config (no deploy)
on:
  push:
    branches:
      - feature/cutover-admin-readiness-20261020
    paths:
      - .github/workflows/verify-isolated-candidate-config.yml
      - .github/workflows/deploy-isolated-footy-candidate.yml
      - deploy/yandex/footy-cutover-candidate.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/feature/cutover-admin-readiness-20261020' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate saved revision settings and manual deploy guard
        shell: python
        run: |
          from pathlib import Path
          import re
          config = Path("deploy/yandex/footy-cutover-candidate.yaml").read_text()
          workflow = Path(".github/workflows/deploy-isolated-footy-candidate.yml").read_text()
          expected = {
              "container_id": "bbaquq5i6l35i5kbiufb",
              "folder_id": "b1gtdrn5t149v0ckl6ql",
              "runtime_service_account_id": "ajekinma5dcn8agcht7a",
              "image": "cr.yandex/crpocq57tud830bhe7ck/footy-cutover-candidate:eb584d5735678f0808d1ce9e3280f2e7a33ab144",
          }
          for key, value in expected.items():
              assert re.search(rf"(?m)^{key}: {re.escape(value)}$", config), f"Incorrect {key}"
              if key != "image":
                  assert value in workflow, f"{key} missing from deploy workflow"
          assert "image_tag:" in workflow, "Explicit image tag input required"
          assert "required: true" in workflow, "Manual image tag must be required"
          assert "IMAGE_TAG=\"${{ inputs.image_tag }}\"" in workflow, "Missing image tag input binding"
          assert "^[0-9a-f]{40}$" in workflow, "Image tag must be immutable full commit SHA"
          assert "footy-cutover-candidate:${IMAGE_TAG}" in workflow, "Deploy must use selected image tag"
          assert expected["image"] not in workflow, "Old image must not be hardcoded in deploy"
          for key in ("ENABLE_CUTOVER_PREDICTION_WRITES", "ENABLE_CUTOVER_ADMIN_WRITES", "ENABLE_CUTOVER_RESULT_WRITES"):
              assert re.search(rf'(?m)^  {key}: "false"$', config), f"Unsafe {key}"
              assert f"--environment {key}=false" in workflow, f"Unsafe deployment {key}"
          for key in ("CUTOVER_AUTH_DATABASE_URL", "CUTOVER_RATE_PEPPER"):
              assert f"    {key}: {key}" in config
              assert f"environment-variable={key}," in workflow
          assert "workflow_dispatch:" in workflow
          assert "DEPLOY-ISOLATED-CANDIDATE" in workflow
          assert "environment: yandex-test" in workflow
          assert "on:\n  push:" not in workflow, "Deploy must not run on push"
          assert "public_access: false" in config
          assert "expected_neon_host: ep-divine-rain-b1d1r892.c-5.eu-central-1.aws.neon.tech" in config
          print("Static configuration and safety gates verified; no Yandex API calls or deployment.")
