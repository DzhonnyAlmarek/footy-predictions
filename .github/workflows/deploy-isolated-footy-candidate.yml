name: Deploy isolated Footy candidate (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-ISOLATED-CANDIDATE to authorize one revision attempt"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/feature/cutover-admin-readiness-20261020' && inputs.confirmation == 'DEPLOY-ISOLATED-CANDIDATE' }}
    runs-on: ubuntu-latest
    environment: yandex-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check saved revision configuration
        run: |
          set -euo pipefail
          test -f deploy/yandex/footy-cutover-candidate.yaml
          grep -q 'container_id: bbaquq5i6l35i5kbiufb' deploy/yandex/footy-cutover-candidate.yaml
          grep -q 'ENABLE_CUTOVER_ADMIN_WRITES: "false"' deploy/yandex/footy-cutover-candidate.yaml
          grep -q 'ENABLE_CUTOVER_PREDICTION_WRITES: "false"' deploy/yandex/footy-cutover-candidate.yaml
          grep -q 'ENABLE_CUTOVER_RESULT_WRITES: "false"' deploy/yandex/footy-cutover-candidate.yaml
      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/DzhonnyAlmarek');
            core.setSecret(token);
            core.setOutput('jwt', token);
      - name: Authenticate to Yandex Cloud
        env:
          GITHUB_OIDC_JWT: ${{ steps.oidc.outputs.jwt }}
          SERVICE_ACCOUNT_ID: ajefphrico3hogta85jt
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 -o /tmp/yc-token.json -w '%{http_code}' \
            -X POST https://auth.yandex.cloud/oauth/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          test "$code" = 200
          token="$(jq -er '.access_token' /tmp/yc-token.json)"
          echo "::add-mask::$token"
          echo "YC_IAM_TOKEN=$token" >> "$GITHUB_ENV"
          rm -f /tmp/yc-token.json
      - name: Install Yandex Cloud CLI
        run: |
          set -euo pipefail
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Deploy one isolated candidate revision
        env:
          YC_CLOUD_ID: b1ge8jgq7kh768aapao1
          YC_FOLDER_ID: b1gtdrn5t149v0ckl6ql
        run: |
          set -euo pipefail
          yc serverless container revision deploy \
            --container-id bbaquq5i6l35i5kbiufb \
            --image cr.yandex/crpocq57tud830bhe7ck/footy-cutover-candidate:3124524279d417aac588ec41dc541c8220d6323d \
            --service-account-id ajekinma5dcn8agcht7a \
            --cores 1 --core-fraction 100 --memory 512MB \
            --execution-timeout 30s --concurrency 1 \
            --environment NODE_ENV=production \
            --environment DEPLOY_TARGET=yandex-neon-production-candidate \
            --environment ENABLE_CUTOVER_PREVIEW=true \
            --environment ENABLE_CUTOVER_AUTH=true \
            --environment ENABLE_CUTOVER_LOGIN=true \
            --environment ENABLE_CUTOVER_PREDICTION_WRITES=false \
            --environment ENABLE_CUTOVER_ADMIN_WRITES=false \
            --environment ENABLE_CUTOVER_RESULT_WRITES=false \
            --secret environment-variable=CUTOVER_AUTH_DATABASE_URL,id=e6qht354a446srlm5ge9,version-id=e6qgv896cvs5t8n3jbpo,key=CUTOVER_AUTH_DATABASE_URL \
            --secret environment-variable=CUTOVER_RATE_PEPPER,id=e6qht354a446srlm5ge9,version-id=e6qgv896cvs5t8n3jbpo,key=CUTOVER_RATE_PEPPER
